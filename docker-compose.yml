# Local development stack: hot-reloading backend and Vite dev server.
# For a production-style build use docker-compose.prod.yml.
services:
  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    user: root          # the bind mount is owned by the host user
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: development
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  frontend:
    image: node:20-alpine
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
