# Production-style stack: built frontend served by nginx, no bind mounts.
#   docker compose -f docker-compose.prod.yml up --build
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      CORS_ALLOW_ORIGINS: http://localhost:8080

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
