[project]
name = "aqi-intelligence-backend"
version = "1.0.0"
description = "Urban air-quality intelligence API with a LangGraph multi-agent orchestrator"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "SIM"]
ignore = ["B008"]   # FastAPI uses callables in argument defaults by design
